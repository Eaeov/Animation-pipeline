name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q src/

      - name: Import check
        run: |
          PYTHONPATH=src python -c "
          import anime_pv
          from anime_pv.adapters import ADAPTERS
          from anime_pv.stages import PIPELINE
          print('version', anime_pv.__version__)
          print('adapters', sorted(ADAPTERS))
          print('pipeline', PIPELINE)
          "

      - name: Architecture guard + unit tests
        run: PYTHONPATH=src pytest tests/ -q

      - name: Offline pipeline smoke
        run: PYTHONPATH=src python -m anime_pv.cli smoke

      - name: Doctor
        run: PYTHONPATH=src python -m anime_pv.cli doctor || true
